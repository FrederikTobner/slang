[package]
name = "slang_shared"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Shared utilities and infrastructure for the Slang compiler"
authors = ["Frederik Tobner <f.tobner@gmail.com>"]

[features]
default = []

[lib]
name = "slang_shared"
path = "src/lib.rs"

[dependencies]
slang_types = { path = "../types" }
slang_error = { path = "../error" }
colored = { workspace = true }

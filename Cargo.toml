[package]
name = "slang"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Slang project"
authors = ["Frederik Tobner <f.tobner@gmail.com>"]

[workspace]
members = [
        "crate/frontend",
        "crate/ir",
        "crate/backend",
        "crate/types",
        "crate/derive",
        "crate/shared",
        "crate/error",
        "crate/compilation_pipeline",
        "tools/ast-printer",
        "tools/token-printer",
        "tools/bytecode-printer",
]

# Only build essential components by default
default-members = [
        "crate/*",
        ".", # Root slang binary
]

[workspace.dependencies]
slang_compilation_pipeline = { path = "crate/compilation_pipeline", features = [] }
slang_frontend = { path = "crate/frontend" }
slang_ir = { path = "crate/ir" }
slang_backend = { path = "crate/backend" }
slang_shared = { path = "crate/shared" }
slang_error = { path = "crate/error" }
# Shared external dependencies
colored = "3.1.1"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
syn = "3.0.9"
quote = "1.0.47"
thiserror = "2.0.21"
zip = "9.2.1"
tempfile = "3.27.0"
# Dev dependencies  
rstest = "0.28.0"
peak_alloc = "0.3.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
divan = "0.1.21"

# Tool-specific commands via cargo aliases
[workspace.metadata.commands]
build-tools = "cargo build --package ast-printer --package token-printer --package bytecode-printer"

[features]
default = []
trace-execution = ["slang_backend/trace-execution"]

[dependencies]
clap = { workspace = true }
colored = { workspace = true }
slang_backend = { path = "crate/backend", features = [] }
slang_compilation_pipeline = { path = "crate/compilation_pipeline", features = [] }
slang_error = { path = "crate/error", features = [] }
slang_frontend = { path = "crate/frontend", features = [] }
slang_ir = { path = "crate/ir", features = [] }
zip = { workspace = true }


[dev-dependencies]
# E2E tests
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
rstest = { workspace = true }
# Performance tests
divan = { workspace = true }
peak_alloc = { workspace = true }


[[bench]]
name = "lexer_benchmarks"
harness = false

[[bench]]
name = "parser_benchmarks"
harness = false

[[bench]]
name = "semantic_benchmarks"
harness = false

[[bench]]
name = "codegen_benchmarks"
harness = false

[[bench]]
name = "vm_benchmarks"
harness = false

[[bench]]
name = "e2e_benchmarks"
harness = false

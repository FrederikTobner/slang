[package]
name = "ast-printer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "AST analysis and printing tool for Slang"
authors = ["Frederik Tobner <f.tobner@gmail.com>"]

[lib]
name = "ast_printer_lib"
path = "src/lib.rs"

[[bin]]
name = "ast-printer"
path = "src/main.rs"

[dependencies]
slang_compilation_pipeline = { workspace = true }
slang_ir = { workspace = true }
slang_error = { workspace = true }
slang_frontend = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
